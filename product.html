<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi tiết sản phẩm — Aura Perfume</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="index.html">
          <img src="images/logo/AURA Perfume Metallic Gold Logo.png" alt="Aura Perfume Logo" class="brand-logo" />
        </a>
        <button id="nav-toggle" class="nav-toggle" aria-label="Menu">☰</button>
        <nav class="main-nav">
          <a href="index.html#nuoc-hoa-nam">Nước Hoa Nam</a>
          <a href="index.html#nuoc-hoa-nu">Nước Hoa Nữ</a>
          <a href="index.html#nuoc-hoa-unisex">Unisex</a>
          <a href="index.html#qua-tang">Quà Tặng</a>
          <a href="products.html">Sản phẩm</a>
        </nav>
        <div class="header-actions">
          <button id="dark-toggle" class="nav-link dark-toggle" aria-label="Chế độ tối">☾</button>
          <a href="#" class="nav-link cart-link">Giỏ hàng (<span class="cart-count">0</span>)</a>
        </div>
      </div>
    </header>

    <main class="product-detail" id="product-detail">
      <!-- RENDER TỪ JS: đọc ?id= rồi tìm trong PRODUCTS -->
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <div>
          <p class="footer-brand">Aura Perfume</p>
          <p class="footer-copy">© 2026 Aura Perfume. Haute Parfumerie Minimaliste.</p>
        </div>
        <form id="contact-form" class="contact-form" novalidate>
          <h3>Liên hệ</h3>
          <input name="name" placeholder="Họ tên" />
          <small id="err-name" class="err"></small>
          <input name="email" placeholder="Email" />
          <small id="err-email" class="err"></small>
          <input name="phone" placeholder="Số điện thoại" />
          <small id="err-phone" class="err"></small>
          <textarea name="message" placeholder="Nội dung" rows="3"></textarea>
          <small id="err-message" class="err"></small>
          <button class="btn btn-primary" type="submit">Gửi</button>
        </form>
      </div>
    </footer>

    <script src="js/products.js"></script>
    <script src="js/carts.js"></script>
    <script src="js/app.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const id = Number(new URLSearchParams(location.search).get('id'));
        const p = PRODUCTS.find((x) => x.id === id);
        const el = document.getElementById('product-detail');
        if (!p) { el.innerHTML = '<p>Không tìm thấy sản phẩm.</p>'; return; }
        document.title = p.name + ' — Aura Perfume';
        el.innerHTML = `
          <div class="detail-media"><img src="${p.image}" alt="${p.name}" /></div>
          <div class="detail-info">
            <p class="product-cat">${TAG_LABEL[p.tag]}</p>
            <h1 class="section-title">${p.name}</h1>
            <p class="product-notes">${p.notes}</p>
            <p class="product-price">${formatPrice(p.price)}</p>
            <button class="btn btn-primary" data-add="${p.id}">Thêm giỏ</button>
            <a class="link-editorial" href="products.html">← Quay lại danh sách</a>
          </div>`;
      });
    </script>
  </body>
</html>
